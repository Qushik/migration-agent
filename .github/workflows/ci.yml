name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build shared packages first
        run: |
          cd packages/shared && npm install --ignore-scripts && npm run build --if-present
          cd ../../packages/agents && npm install --ignore-scripts && npm run build --if-present
        continue-on-error: true

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build all
        run: npm run build --workspaces --if-present
        continue-on-error: true

      - name: Test
        run: npm run test --workspaces --if-present
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: CI Summary
        run: echo "✅ CI pipeline completed for migration-agent"
