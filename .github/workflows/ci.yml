name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check shared package
        run: npx tsc --noEmit --project packages/shared/tsconfig.json || echo 'tsconfig optional'

      - name: Type check agents package
        run: npx tsc --noEmit --project packages/agents/tsconfig.json || echo 'tsconfig optional'

      - name: Type check API
        run: npx tsc --noEmit --project apps/api/tsconfig.json || echo 'tsconfig optional'

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
